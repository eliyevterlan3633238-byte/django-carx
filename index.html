<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bəxt Çarxı - Mükəmməl Düzüm və Fişəng</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap');

    * { box-sizing: border-box; }
    
    body {
      margin: 0; font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow-x: hidden; overflow-y: auto; position: relative; padding: 30px 0;
    }

    body::before, body::after {
      content: ''; position: absolute; width: 50vw; height: 50vw; z-index: 0; filter: blur(50px);
    }
    body::before { top: -15%; left: -10%; background: radial-gradient(circle, rgba(255,0,128,0.2) 0%, transparent 60%); }
    body::after { bottom: -15%; right: -10%; background: radial-gradient(circle, rgba(0,255,200,0.15) 0%, transparent 60%); }

    #settings-btn {
      position: absolute; top: 20px; right: 20px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; font-size: 24px; width: 50px; height: 50px; border-radius: 50%;
      cursor: pointer; z-index: 50; backdrop-filter: blur(10px); transition: all 0.3s;
      display: flex; justify-content: center; align-items: center;
    }
    #settings-btn:hover { background: rgba(255, 255, 255, 0.2); transform: rotate(90deg); box-shadow: 0 0 15px rgba(255,255,255,0.4); }

    h1 {
      margin-top: 10px; margin-bottom: 30px; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900;
      text-transform: uppercase; letter-spacing: 3px;
      background: linear-gradient(to right, #ffaa00, #ff007f); -webkit-background-clip: text; color: transparent;
      text-shadow: 0 10px 30px rgba(255,0,127,0.3); z-index: 10; text-align: center;
    }

    .wheel-container {
      position: relative; width: min(90vw, 65vh); max-width: 450px; aspect-ratio: 1 / 1; z-index: 10;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6)); margin-bottom: 20px;
    }

    .pointer-wrapper { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); z-index: 20; }
    .pointer {
      width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 45px solid #FFD700;
      transform-origin: top center; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)); position: relative;
    }
    .pointer::after {
      content: ''; position: absolute; top: -42px; left: -12px;
      border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid #fff;
    }
    @keyframes tick { 0% { transform: rotate(0deg); } 30% { transform: rotate(-22deg); } 60% { transform: rotate(12deg); } 100% { transform: rotate(0deg); } }
    .tick-anim { animation: tick 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    #wheel {
      width: 100%; height: 100%; border-radius: 50%; border: 8px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.15), inset 0 0 25px rgba(0,0,0,0.6);
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); box-sizing: border-box;
    }

    #spin-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #ff007f, #ffaa00);
      border: 4px solid #fff; color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; z-index: 10;
      box-shadow: 0 0 40px rgba(255,0,127,0.7); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-transform: uppercase; letter-spacing: 2px;
    }
    #spin-btn:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 60px rgba(255,0,127,1); }
    #spin-btn:disabled { cursor: not-allowed; filter: grayscale(1); opacity: 0.8; box-shadow: none; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 5, 20, 0.7);
      display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(15px);
      opacity: 1; visibility: visible; transition: opacity 0.5s, visibility 0.5s;
    }
    .modal.hidden { opacity: 0; visibility: hidden; }
    
    /* YENİ: Flexbox düzümü */
    .modal-content {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px 30px;
      border-radius: 40px; box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.05);
      width: 90%; max-width: 600px; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center;
    }
    .modal:not(.hidden) .modal-content { animation: elasticBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes elasticBounce { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 80% { transform: scale(0.95); } 100% { transform: scale(1); opacity: 1; } }

    /* Digər UI animasiyaları - margin-lər flex gap-ə görə sıfırlandı */
    #congrats-msg { font-size: 2.2rem; font-weight: 900; margin: 0; color: #fff; text-transform: uppercase; letter-spacing: 2px; opacity: 0; }
    .animate-congrats { animation: fadeInDown 0.5s forwards; }
    #gift-text-wrap { font-size: 1.5rem; color: rgba(255,255,255,0.9); margin: 0; opacity: 0; }
    .animate-wrap { animation: fadeInUp 0.5s forwards; }

    /* Qutunun içindən çıxan mətn - Artıq Flex flow içindədir */
    .gift-text-3d {
      font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; line-height: 1.2; text-align: center; margin: 0;
      background: linear-gradient(90deg, #ff007f, #ffaa00, #00ffaa, #00aaff, #aa00ff, #ff007f); background-size: 200% auto;
      -webkit-background-clip: text; color: transparent; text-shadow: 0 0 25px rgba(255, 170, 0, 0.6);
      
      /* Animasiya üçün başlanğıc (qutunun arxasında/içində gizlənir) */
      position: relative; z-index: 0; 
      transform: translateY(120px) scale(0.3); opacity: 0;
    }
    .gift-text-3d.text-anim { animation: textRise 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, gradientPulse 3s linear infinite; }
    @keyframes textRise {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes gradientPulse { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    /* --- REALİSTİK 2.5D SVG HƏDİYYƏ QUTUSU --- */
    .scene-wrapper {
      position: relative; width: 250px; height: 250px; margin: 0; opacity: 0; z-index: 1; /* Mətndən üstdə */
    }
    .scene-wrapper.drop-anim { animation: boxDropIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes boxDropIn {
      from { transform: translateY(-200px) scale(0.3); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .gift-scene {
      width: 100%; height: 100%; position: relative; animation: floatBox 3s ease-in-out infinite;
    }
    @keyframes floatBox { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

    .gift-body, .gift-lid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .gift-body { z-index: 1; }
    .gift-lid { z-index: 3; }

    .gift-body svg { filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); }
    .gift-lid svg { filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }

    .gift-lid.open-anim { animation: lidFly 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    @keyframes lidFly {
      to { transform: translateY(-120px) translateX(60px) rotate(25deg); opacity: 0; }
    }
    
    #reset-btn {
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255,255,255,0.5); color: white; padding: 16px 45px;
      font-size: 1.3rem; font-weight: 800; border-radius: 50px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
      position: relative; overflow: hidden; backdrop-filter: blur(5px); opacity: 0; margin: 0;
    }
    .animate-btn { animation: fadeInUp 0.5s forwards; }
    #reset-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: all 0.5s; }
    #reset-btn:hover::before { left: 100%; }
    #reset-btn:hover { background: rgba(255, 255, 255, 0.25); border-color: #fff; transform: translateY(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.4); }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Admin Panel */
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; width: 100%; }
    .admin-input-group { display: flex; flex-direction: column; }
    .admin-input-group label { font-size: 13px; color: #FFD700; margin-bottom: 5px; font-weight: 600; }
    .admin-input-group input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 10px 15px; border-radius: 10px; font-family: 'Poppins', sans-serif; outline: none; transition: all 0.3s; }
    .admin-input-group input:focus { border-color: #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.4); }
    .btn-primary, .btn-secondary { padding: 14px 35px; border-radius: 50px; font-weight: bold; font-size: 1.1rem; cursor: pointer; border: none; transition: all 0.3s; font-family: 'Poppins', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
    .btn-primary { background: linear-gradient(135deg, #ff007f, #ffaa00); color: #fff; box-shadow: 0 5px 15px rgba(255,0,127,0.4); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,0,127,0.6); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    /* Konfeti və İki-tərəfli Düzgün Fişəng partlayışları (YENİ) */
    #confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; overflow: hidden; }
    .confetti-piece { position: absolute; top: -30px; opacity: 0; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg) scale(0.5); opacity: 0; } }
    
    .new-firework-particle {
      position: fixed; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 12px currentColor; pointer-events: none; z-index: 9999;
      animation: explode 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes explode { 
      0% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } 
      100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.1); opacity: 0; } 
    }

    @media (max-width: 600px) {
      .modal-content { padding: 40px 20px; }
      .admin-grid { grid-template-columns: 1fr; }
      #reset-btn { font-size: 1.1rem; padding: 12px 30px; }
    }
  </style>
</head>
<body>

  <button id="settings-btn" title="Hədiyyələri Dəyiş">⚙️</button>
  <div id="confetti-container"></div>
  <h1>Bəxt Çarxı</h1>
  
  <div class="wheel-container">
    <div class="pointer-wrapper"><div class="pointer" id="pointer"></div></div>
    <canvas id="wheel" width="600" height="600"></canvas>
    <button id="spin-btn">Fırlat</button>
  </div>

  <div id="result-modal" class="modal hidden">
    <!-- Flexbox sütun düzümü -->
    <div class="modal-content">
      <h2 id="congrats-msg">Təbriklər!</h2>
      <div id="gift-text-wrap">Siz qazandınız:</div>
      
      <!-- Flex flow daxilində tam hündürlük tutan mətn. Animasiya edəndə qutunun arxasından çıxacaq. -->
      <div class="gift-text-3d" id="gift-msg">Hədiyyə</div>
      
      <!-- Möhtəşəm Realistik 2.5D SVG Hədiyyə Qutusu -->
      <div class="scene-wrapper" id="gift-box">
        <div class="gift-scene">
          
          <!-- Gövdə -->
          <div class="gift-body">
            <svg width="100%" height="100%" viewBox="0 0 200 200" style="overflow: visible;">
              <defs>
                <linearGradient id="body-left" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e6e6e6"/>
                </linearGradient>
                <linearGradient id="body-right" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#e6e6e6"/><stop offset="100%" stop-color="#cccccc"/>
                </linearGradient>
                <linearGradient id="ribbon-red" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#aa0000"/><stop offset="30%" stop-color="#ff1a1a"/>
                  <stop offset="50%" stop-color="#ff9999"/><stop offset="70%" stop-color="#ff1a1a"/>
                  <stop offset="100%" stop-color="#aa0000"/>
                </linearGradient>
              </defs>
              <polygon points="100,60 160,90 100,120 40,90" fill="#151515" />
              <polygon points="40,90 100,120 100,180 40,150" fill="url(#body-left)" />
              <polygon points="100,120 160,90 160,150 100,180" fill="url(#body-right)" />
              <polygon points="60,100 80,110 80,170 60,160" fill="url(#ribbon-red)" />
              <polygon points="120,110 140,100 140,160 120,170" fill="url(#ribbon-red)" />
              <polygon points="100,135 40,105 40,120 100,150" fill="url(#ribbon-red)" />
              <polygon points="100,135 160,105 160,120 100,150" fill="url(#ribbon-red)" />
              <polygon points="60,115 80,125 80,140 60,130" fill="rgba(0,0,0,0.2)" />
              <polygon points="120,125 140,115 140,130 120,140" fill="rgba(0,0,0,0.2)" />
            </svg>
          </div>

          <!-- Qapaq -->
          <div class="gift-lid" id="box-lid">
            <svg width="100%" height="100%" viewBox="0 0 200 200" style="overflow: visible;">
              <defs>
                <linearGradient id="lid-top" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f0f0f0"/>
                </linearGradient>
                <linearGradient id="lid-left" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#d9d9d9"/>
                </linearGradient>
                <linearGradient id="lid-right" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#d9d9d9"/><stop offset="100%" stop-color="#bfbfbf"/>
                </linearGradient>
              </defs>
              <polygon points="35,87.5 100,125 100,140 35,102.5" fill="url(#lid-left)" />
              <polygon points="100,125 165,87.5 165,102.5 100,140" fill="url(#lid-right)" />
              <polygon points="100,55 165,87.5 100,125 35,87.5" fill="url(#lid-top)" />
              <polygon points="60,75 75,67.5 140,100 125,107.5" fill="url(#ribbon-red)" />
              <polygon points="125,72.5 140,80 75,112.5 60,105" fill="url(#ribbon-red)" />
              <polygon points="60,105 75,112.5 75,127.5 60,120" fill="url(#ribbon-red)" />
              <polygon points="125,107.5 140,100 140,115 125,122.5" fill="url(#ribbon-red)" />
              <polygon points="90,85 110,95 110,105 90,95" fill="rgba(0,0,0,0.2)" />
              <path d="M95,90 C60,115 60,145 65,160 C75,145 85,115 100,90" fill="url(#ribbon-red)" />
              <path d="M105,90 C140,115 140,145 135,160 C125,145 115,115 100,90" fill="url(#ribbon-red)" />
              <ellipse cx="65" cy="85" rx="20" ry="6" transform="rotate(-35 65 85)" fill="rgba(0,0,0,0.4)" />
              <ellipse cx="135" cy="85" rx="20" ry="6" transform="rotate(35 135 85)" fill="rgba(0,0,0,0.4)" />
              <ellipse cx="65" cy="85" rx="35" ry="18" transform="rotate(-35 65 85)" fill="url(#ribbon-red)" />
              <ellipse cx="135" cy="85" rx="35" ry="18" transform="rotate(35 135 85)" fill="url(#ribbon-red)" />
              <ellipse cx="80" cy="65" rx="25" ry="12" transform="rotate(-65 80 65)" fill="url(#ribbon-red)" />
              <ellipse cx="120" cy="65" rx="25" ry="12" transform="rotate(65 120 65)" fill="url(#ribbon-red)" />
              <circle cx="100" cy="90" r="12" fill="url(#ribbon-red)" />
              <circle cx="100" cy="90" r="10" fill="rgba(255,255,255,0.2)" />
            </svg>
          </div>
        </div>
      </div>
      
      <button id="reset-btn">Yenidən Fırlat</button>
    </div>
  </div>

  <div id="admin-modal" class="modal hidden">
    <!-- Admin paneli eyni flexbox qaydalarına əsasən düzüldü -->
    <div class="modal-content">
      <h2 style="color: #FFD700; font-weight: 900; letter-spacing: 1px; margin: 0;">Admin Panel</h2>
      <p style="color: #ccc; font-size: 14px; margin: 0;">Hər rəqəmə (sektora) uyğun gələn hədiyyəni dəyişin:</p>
      <div class="admin-grid" id="admin-grid"></div>
      <div style="display: flex; gap: 15px; justify-content: center;">
        <button id="admin-close-btn" class="btn-secondary">Ləğv et</button>
        <button id="admin-save-btn" class="btn-primary">Yadda Saxla</button>
      </div>
    </div>
  </div>

  <script>
    const defaultGifts = {
      1: "10% Endirim Kuponu", 2: "Pulsuz Çatdırılma", 3: "Sürpriz Hədiyyə", 4: "20 AZN Keşbek",
      5: "1+1 Kampaniyası", 6: "Pulsuz Qəhvə", 7: "50% Endirim Kuponu", 8: "VIP Status"
    };
    let gifts = JSON.parse(localStorage.getItem('wheelGifts')) || defaultGifts;
    const colors = ["#FF007F", "#FF8A00", "#FFD700", "#00FFAA", "#00AAFF", "#7F00FF", "#FF0055", "#00FFCC"];

    const canvas = document.getElementById('wheel'); const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spin-btn'); const pointer = document.getElementById('pointer');
    const resultModal = document.getElementById('result-modal'); const resetBtn = document.getElementById('reset-btn');
    const settingsBtn = document.getElementById('settings-btn'); const adminModal = document.getElementById('admin-modal');
    const adminCloseBtn = document.getElementById('admin-close-btn'); const adminSaveBtn = document.getElementById('admin-save-btn');
    const adminGrid = document.getElementById('admin-grid');

    // --- Səs Sistemi (Web Audio API) ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
      gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.03);
    }

    // Whoosh + Pop Səsi
    function playBoxOpenSound() {
      if (!audioCtx) return;
      const time = audioCtx.currentTime;
      
      const whooshOsc = audioCtx.createOscillator(); const whooshGain = audioCtx.createGain();
      whooshOsc.type = 'sine'; whooshOsc.frequency.setValueAtTime(100, time); whooshOsc.frequency.exponentialRampToValueAtTime(1500, time + 0.15);
      whooshGain.gain.setValueAtTime(0, time); whooshGain.gain.linearRampToValueAtTime(0.3, time + 0.1); whooshGain.gain.linearRampToValueAtTime(0.01, time + 0.15);
      whooshOsc.connect(whooshGain); whooshGain.connect(audioCtx.destination); whooshOsc.start(time); whooshOsc.stop(time + 0.15);
      
      const popTime = time + 0.15;
      const popOsc = audioCtx.createOscillator(); const popFilter = audioCtx.createBiquadFilter(); const popGain = audioCtx.createGain();
      popOsc.type = 'sawtooth'; popOsc.frequency.setValueAtTime(400, popTime); popOsc.frequency.exponentialRampToValueAtTime(100, popTime + 0.1);
      popFilter.type = 'lowpass'; popFilter.frequency.setValueAtTime(1500, popTime); popFilter.frequency.exponentialRampToValueAtTime(200, popTime + 0.1);
      popGain.gain.setValueAtTime(0, popTime); popGain.gain.linearRampToValueAtTime(0.8, popTime + 0.02); popGain.gain.exponentialRampToValueAtTime(0.01, popTime + 0.15);
      popOsc.connect(popFilter); popFilter.connect(popGain); popGain.connect(audioCtx.destination);
      popOsc.start(popTime); popOsc.stop(popTime + 0.15);
    }

    // --- Admin Panel ---
    function openAdminPanel() {
      if(isSpinning) return; adminGrid.innerHTML = ''; 
      for(let i = 1; i <= 8; i++) {
        const group = document.createElement('div'); group.className = 'admin-input-group';
        group.innerHTML = `<label>Sektor ${i} (Rəqəm ${i}):</label><input type="text" id="gift-input-${i}" value="${gifts[i]}">`;
        adminGrid.appendChild(group);
      }
      adminModal.classList.remove('hidden');
    }
    settingsBtn.addEventListener('click', openAdminPanel);
    adminCloseBtn.addEventListener('click', () => adminModal.classList.add('hidden'));
    adminSaveBtn.addEventListener('click', () => {
      for(let i = 1; i <= 8; i++) gifts[i] = document.getElementById(`gift-input-${i}`).value.trim() || `Hədiyyə ${i}`; 
      localStorage.setItem('wheelGifts', JSON.stringify(gifts));
      const originalText = adminSaveBtn.textContent; adminSaveBtn.textContent = "Saxlanıldı! ✔";
      setTimeout(() => { adminSaveBtn.textContent = originalText; adminModal.classList.add('hidden'); }, 700);
    });

    // --- Çarxın Çəkilməsi ---
    const numSectors = 8; const arc = (2 * Math.PI) / numSectors; 
    const width = canvas.width; const height = canvas.height;
    const centerX = width / 2; const centerY = height / 2; const radius = width / 2 - 10; 
    function drawWheel() {
      ctx.clearRect(0, 0, width, height); const startAngle = -Math.PI / 2 - arc / 2;
      for (let i = 0; i < numSectors; i++) {
        const angle = startAngle + i * arc;
        ctx.beginPath(); ctx.fillStyle = colors[i];
        ctx.moveTo(centerX, centerY); ctx.arc(centerX, centerY, radius, angle, angle + arc, false); ctx.lineTo(centerX, centerY); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 4; ctx.stroke();
        ctx.save(); ctx.fillStyle = "#ffffff"; ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
        const textAngle = angle + arc / 2; const textRadius = radius * 0.72; 
        ctx.translate(centerX + Math.cos(textAngle) * textRadius, centerY + Math.sin(textAngle) * textRadius);
        ctx.rotate(textAngle + Math.PI / 2);
        ctx.font = "bold 55px 'Poppins', sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText((i + 1).toString(), 0, 0); ctx.restore();
      }
    }
    drawWheel(); 

    // --- Fırlanma Məntiqi ---
    let currentRotation = 0; let isSpinning = false; let spinReqId = null;
    function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }

    spinBtn.addEventListener('click', () => {
      initAudio();
      const silentOsc = audioCtx.createOscillator(); silentOsc.connect(audioCtx.destination);
      silentOsc.start(); silentOsc.stop(audioCtx.currentTime + 0.001);

      if (isSpinning) return;
      isSpinning = true; spinBtn.disabled = true; settingsBtn.style.opacity = '0.5'; settingsBtn.style.pointerEvents = 'none';
      document.getElementById('confetti-container').innerHTML = '';
      
      const extraSpins = (5 + Math.floor(Math.random() * 5)) * 360; 
      const randomDegree = Math.floor(Math.random() * 360);
      const targetRotation = currentRotation + extraSpins + randomDegree;
      const duration = (5 + Math.random() * 3) * 1000; 
      
      const startRotation = currentRotation; const startTime = performance.now();
      let lastSector = Math.floor(((startRotation + 22.5) % 360) / 45);

      playTickSound(); // Dərhal səsi başlatmaq üçün

      function animateSpin(currentTime) {
        let progress = (currentTime - startTime) / duration; if (progress > 1) progress = 1;
        const currentAngle = startRotation + (targetRotation - startRotation) * easeOutQuart(progress);
        canvas.style.transform = `rotate(${currentAngle}deg)`;
        
        const currentSector = Math.floor(((currentAngle + 22.5) % 360) / 45);
        if (currentSector !== lastSector) {
          pointer.classList.remove('tick-anim'); void pointer.offsetWidth; pointer.classList.add('tick-anim');
          playTickSound(); lastSector = currentSector;
        }
        
        if (progress < 1) { spinReqId = requestAnimationFrame(animateSpin); }
        else {
          currentRotation = currentAngle;
          const winningLabel = (Math.floor((382.5 - (currentRotation % 360)) / 45) % 8) + 1; 
          showResult(gifts[winningLabel]);
        }
      }
      spinReqId = requestAnimationFrame(animateSpin);
    });

    // --- Nəticə və İki-tərəfli DÜZGÜN Fişəng partlayışı (YENİ) ---
    function generateFireworks() {
      // 1. Mərkəzi yuxarıdan tökülən konfetilər
      const container = document.getElementById('confetti-container');
      const colors = ['#FFD700', '#FF007F', '#00AAFF', '#7F00FF', '#00FFAA'];
      for(let i=0; i < 60; i++) {
        const conf = document.createElement('div'); conf.classList.add('confetti-piece'); conf.style.left = Math.random() * 100 + '%';
        const size = Math.random() * 12 + 6; conf.style.width = size + 'px'; conf.style.height = size + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animation = `fall ${2 + Math.random() * 3}s linear ${Math.random() * 0.3}s forwards`;
        if (Math.random() > 0.5) conf.style.borderRadius = '50%'; container.appendChild(conf);
      }
      
      // 2. Qutunun tam kənarlarından (sol və sağ) radial partlayan dairəvi fişənglər
      createFireworkBurst('left', colors);
      createFireworkBurst('right', colors);
    }

    function createFireworkBurst(side, colors) {
      const box = document.getElementById('gift-box');
      const rect = box.getBoundingClientRect(); // Qutunun ekrandakı absolut mövqeyini alırıq
      
      // Partlayış mərkəzini qutunun mərkəz-sağ və mərkəz-sol kənarlarına hesablayırıq
      const originY = rect.top + (rect.height / 2);
      const originX = side === 'left' ? rect.left : rect.right;
      
      const numParticles = 8 + Math.floor(Math.random() * 5); // 8-12 zərrəcik
      
      for (let i = 0; i < numParticles; i++) {
        const particle = document.createElement('div');
        particle.classList.add('new-firework-particle');
        particle.style.left = originX + 'px';
        particle.style.top = originY + 'px';
        particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        
        // Dairəvi yayılma bucağı
        const angle = Math.random() * Math.PI * 2; 
        const distance = 80 + Math.random() * 120; // 80px - 200px kənara uçuş məsafəsi
        
        particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
        particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
        
        document.body.appendChild(particle);
        
        // Animasiya bitdikdən sonra div-i silirik (yaddaş sızmaması üçün)
        setTimeout(() => { if(particle.parentNode) particle.parentNode.removeChild(particle); }, 1200);
      }
    }

    function showResult(giftName) {
      document.getElementById('gift-msg').textContent = giftName; resultModal.classList.remove('hidden');
      document.getElementById('gift-box').classList.add('drop-anim');
      setTimeout(() => {
        document.getElementById('box-lid').classList.add('open-anim');
        document.getElementById('gift-msg').classList.add('text-anim');
        generateFireworks(); playBoxOpenSound(); 
      }, 600);
      setTimeout(() => {
        document.getElementById('congrats-msg').classList.add('animate-congrats');
        document.getElementById('gift-text-wrap').classList.add('animate-wrap');
        document.getElementById('reset-btn').classList.add('animate-btn');
      }, 1500);
    }

    resetBtn.addEventListener('click', () => {
      initAudio(); resultModal.classList.add('hidden');
      setTimeout(() => {
        ['drop-anim'].forEach(c => document.getElementById('gift-box').classList.remove(c));
        ['open-anim'].forEach(c => document.getElementById('box-lid').classList.remove(c));
        ['text-anim'].forEach(c => document.getElementById('gift-msg').classList.remove(c));
        ['animate-congrats'].forEach(c => document.getElementById('congrats-msg').classList.remove(c));
        ['animate-wrap'].forEach(c => document.getElementById('gift-text-wrap').classList.remove(c));
        ['animate-btn'].forEach(c => document.getElementById('reset-btn').classList.remove(c));
        isSpinning = false; spinBtn.disabled = false; settingsBtn.style.opacity = '1'; settingsBtn.style.pointerEvents = 'auto';
      }, 500);
    });
  </script>
</body>
